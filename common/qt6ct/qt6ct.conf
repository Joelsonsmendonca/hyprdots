; Tema dos apps Qt6 (Dolphin etc.) fora do Plasma. Ativado por
; QT_QPA_PLATFORMTHEME=qt6ct em common/uwsm/env-hyprland. Ajustar pela GUI: qt6ct.
; Paleta clara (padrão do Breeze) pra combinar com o GTK em Adwaita; pra escuro,
; escolher o esquema de cores na aba Appearance do qt6ct.
[Appearance]
custom_palette=false
icon_theme=breeze
standard_dialogs=default
style=Breeze

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
dialog_buttons_have_icons=1
menus_have_icons=true
show_shortcuts_in_context_menus=true
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
