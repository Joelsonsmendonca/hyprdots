# hypridle — bloqueio e desligamento de tela por inatividade.
# Roda como hypridle.service (systemd --user, habilitado pelo bootstrap.sh).
# Vídeo tocando / chamada no navegador seguram o idle sozinhos (idle-inhibit).
# Ref: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# SEM suspensão automática de propósito: o desktop roda github-runner-* (CI) e
# suspender mata os jobs. Suspender na mão: SUPER+M -> Suspender.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # não abre dois hyprlock
    before_sleep_cmd = loginctl lock-session                          # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # religa a tela ao acordar
}

# 5min: escurece o backlight (só tem efeito no notebook; no desktop não há backlight)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10min: bloqueia
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11min: desliga as telas (DPMS)
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
