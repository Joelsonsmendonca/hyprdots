[main]
font=JetBrainsMono Nerd Font:size=12
icon-theme=breeze-dark
icons-enabled=yes
fields=filename,name,generic,comment,categories,keywords
terminal=kitty
lines=8
width=35
horizontal-pad=24
vertical-pad=16
inner-pad=8
line-height=28
letter-spacing=0

[colors]
background=1a1a1aee
text=e0e0e0ff
match=33ccffff
selection=262626ff
selection-text=ffffffff
selection-match=00ff99ff
border=33ccffee

[border]
width=2
radius=10

[dmenu]
exit-immediately-if-empty=yes
